[project]
name = "lumagen-rs232-ha"
version = "0.1.0"
description = "Home Assistant custom integration for Lumagen Radiance processors over RS-232"
requires-python = ">=3.14"
dependencies = ["serialx>=1.11.0"]

[dependency-groups]
dev = ["pytest-homeassistant-custom-component", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
